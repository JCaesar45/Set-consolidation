<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass Card</title>
    <style>
      :root {
        --surface: rgba(255, 255, 255, 0.12);
        --surface-solid: #1e1e2a;
        --edge: rgba(255, 255, 255, 0.25);
        --ink: #f4f4f8;
        --muted: #b8b8c8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--ink);
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
        pointer-events: none;
      }
      body::before {
        background: #e94560;
        top: -120px;
        left: -120px;
      }
      body::after {
        background: #533483;
        bottom: -140px;
        right: -100px;
      }

      .glass {
        position: relative;
        z-index: 1;
        max-width: 360px;
        padding: 2rem;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--edge);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          inset 0 -1px 0 rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
      }

      .glass h2 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .glass p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.55;
      }

      .glass button {
        width: 100%;
        padding: 0.85rem;
        border-radius: 12px;
        border: 0;
        font: inherit;
        font-weight: 600;
        color: #0f0f1a;
        background: linear-gradient(135deg, #ffd6a5, #ffb4a2);
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .glass button:hover {
        transform: translateY(-1px);
      }
      .glass button:active {
        transform: translateY(0);
      }

      @supports not (
        (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
      ) {
        .glass {
          background-color: var(--surface-solid);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .glass button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <article class="glass">
      <h2>Aurora Pendant</h2>
      <p>
        Hand-finished titanium with a suspended opal core. Weighted silhouette,
        unbroken light.
      </p>
      <button type="button">Reserve — $480</button>
    </article>
  </body>
</html>
